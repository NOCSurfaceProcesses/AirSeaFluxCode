[build-system]
requires = [
  "setuptools>=42",
  "wheel",
  "setuptools_scm[toml]>=3.4",
  "setuptools_scm_git_archive",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["AirSeaFluxCode"]

[project]
name = "AirSeaFluxCode"
version = "1.3.3"
dependencies = ["pandas", "numpy"]
requires-python = ">=3.9"
authors = [
  { name = "Stavroula Biri" },
  { name = "Richard Cornes", email = "rcornes@noc.ac.uk" },
  { name = "David Berry" },
  { name = "Elizabeth Kent", email = "eck@noc.ac.uk" },
  { name = "Margaret Yelland" },
]
maintainers = [
  { name = "Joseph Siddons", email = "josidd@noc.ac.uk" },
  { name = "Richard Cornes", email = "rcornes@noc.ac.uk" },
]
description = "AirSeaFluxCode is a python package designed to allow easy exploration of the different bulk formulae parameterizations and the wide range of implementation options"
readme = "README.md"
license = { file = "LICENSE" }
keywords = [
  "fluxes",
  "momentum",
  "turbulence",
  "heat",
  "moisture",
  "ocean",
  "air-sea",
  "height adjustment",
  "bulk formulae",
  "air-sea interaction",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
extra = ["matplotlib", "netCDF4", "tabulate", "ipykernel"]
test = ["pytest"]
docs = [
  "sphinx>=5.3.0",
  "sphinx-autodoc-typehints>=1.12.0",
  "sphinx-rtd-theme>=2.0.0",
]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py311"
exclude = [".eggs", ".git", ".venv", "build", "venv"]

[tool.ruff.lint]
extend-select = [
  "RUF022", # unsorted-dunder-all
]
ignore = [
  "D205", # blank-line-after-summary
  "D400", # ends-in-period
  "D401", # non-imperative-mood
  "D105", # missing docstring in magic method
]
preview = true
select = [
  "C90", # mccabe-complexity
  "D",   # docstrings
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "ICN", # Flake8 Import Conventions
  "S",   # bandit
  "W",   # pycodestyle warnings
]

[tool.ruff.lint.per-file-ignores]
"docs/*.py" = ["D100", "D101", "D102", "D103"]
"test/**/*test*.py" = ["D100", "D101", "D102", "D103", "N802", "S101", "S311"]
"notebooks/*.ipynb" = ["D100", "D101", "D102", "D103", "N802", "S101", "S311"]

[tool.ruff.format]
quote-style = "double"            # Like Black, use double quotes for strings.
indent-style = "space"            # Like Black, indent with spaces, rather than tabs.
skip-magic-trailing-comma = false # Like Black, respect magic trailing commas.
line-ending = "auto"              # Like Black, automatically detect the appropriate line ending.

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-import-conventions.aliases]
"matplotlib.pyplot" = "plt"
numpy = "np"
pandas = "pd"
polars = "pl"
scipy = "sp"
xarray = "xr"
netCDF4 = "nc"

[project.urls]
Repository = "https://github.com/NOCSurfaceProcesses/AirSeaFluxCode.git"
"Bug Tracker" = "https://github.com/NOCSurfaceProcesses/AirSeaFluxCode/issues"
